<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P8 Browser Verifier</title>
    <style>
      html, body { margin: 0; background: #171326; color: #fff8df; font-family: sans-serif; }
      #game-shell { position: relative; width: 1280px; height: 720px; overflow: hidden; }
      #game-canvas { width: 1280px; height: 720px; }
      #ui-root { position: absolute; inset: 0; }
      #p8-verifier-report { position: fixed; left: 8px; bottom: 8px; z-index: 9999; max-width: 760px; padding: 10px; background: rgba(0,0,0,.86); font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <canvas id="game-canvas" width="1280" height="720"></canvas>
      <div id="ui-root"></div>
    </div>
    <section id="p8-verifier-report">
      <strong id="p8-verifier-status">running</strong>
      <ol id="p8-verifier-results"></ol>
    </section>
    <script type="module" src="/src/p8BrowserVerifier.ts"></script>
  </body>
</html>
