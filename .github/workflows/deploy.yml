name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate map layouts
        run: npm run maps:validate

      - name: Verify map editor smoke contract
        run: npm run editor:smoke

      - name: Build
        run: npm run build

      - name: Start verifier dev server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/hime-vite.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/hime-star-journey/p7-browser-verifier.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/hime-star-journey/p8-browser-verifier.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/hime-star-journey/p9-browser-verifier.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/hime-star-journey/p10-browser-verifier.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/hime-star-journey/p11-browser-verifier.html > /dev/null \
              && curl --fail --silent http://127.0.0.1:5173/hime-star-journey/p12-browser-verifier.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hime-vite.log
          exit 1

      - name: P7 browser regression gate
        env:
          P7_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run p7:browser

      - name: P8 browser regression gate
        env:
          P8_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run p8:browser

      - name: P9 browser regression gate
        env:
          P9_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run p9:browser

      - name: P10 browser release gate
        env:
          P10_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          npm run p10:browser 2>&1 | tee /tmp/p10-browser.log

      - name: Upload P10 browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p10-browser-diagnostics
          path: /tmp/p10-browser.log
          if-no-files-found: warn

      - name: P11 browser design contract gate
        env:
          P11_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run p11:browser

      - name: P12 browser release gate
        env:
          P12_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          set -o pipefail
          npm run p12:browser 2>&1 | tee /tmp/p12-browser.log

      - name: Upload P12 browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p12-browser-diagnostics
          path: /tmp/p12-browser.log
          if-no-files-found: warn

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
