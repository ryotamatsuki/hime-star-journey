<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P10 Browser Verifier</title>
    <style>
      html, body { margin: 0; background: #17131f; color: #fff; font-family: sans-serif; }
      #game-shell { position: relative; width: 1280px; height: 720px; }
      #game-canvas { width: 1280px; height: 720px; display: block; }
      #ui-root { position: absolute; inset: 0; }
      #verifier { position: relative; z-index: 200; padding: 12px; background: #fff; color: #222; }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <canvas id="game-canvas" width="1280" height="720"></canvas>
      <div id="ui-root"></div>
    </div>
    <section id="verifier">
      <strong id="p10-verifier-status">P10_BROWSER_VERIFICATION:RUNNING</strong>
      <ol id="p10-verifier-results"></ol>
    </section>
    <script type="module" src="/src/p10BrowserVerifier.ts"></script>
  </body>
</html>
